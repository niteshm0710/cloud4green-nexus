services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: nexus, POSTGRES_USER: nexus, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U nexus"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    env_file: .env
    environment: { DATABASE_URL: "postgresql://nexus:${POSTGRES_PASSWORD}@db:5432/nexus" }
    extra_hosts:
      - "vcsa4.c4g.com:192.168.0.231"
      - "host.docker.internal:host-gateway"
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["3001:80"]
    depends_on: [backend]
volumes: { pgdata: {} }
